<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulb Toggle</title>
  <style>
    body {
      text-align: center;
      margin-top: 50px;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    img {
      width: 150px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    img:hover {
      transform: scale(1.1);
    }
    p {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>💡 Click the bulb to turn it ON/OFF</h2>
  <img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" alt="Bulb">
  <p id="status">Bulb is OFF</p>

  <script>
    const bulb = document.getElementById("bulb");
    const status = document.getElementById("status");
    let isOn = false;

    bulb.addEventListener("click", () => {
      if (isOn) {
        bulb.src = "https://www.w3schools.com/js/pic_bulboff.gif";
        status.textContent = "Bulb is OFF";
        isOn = false;
      } else {
        bulb.src = "https://www.w3schools.com/js/pic_bulbon.gif";
        status.textContent = "Bulb is ON";
        isOn = true;
      }
    });
  </script>
</body>
</html>
